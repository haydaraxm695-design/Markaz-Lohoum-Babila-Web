<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة منيو مركز اللحوم ببيلا</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><style>.admin{max-width:800px;margin:auto;padding:20px 14px 60px}.box{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0}.field{display:grid;gap:6px;margin:10px 0}.field input,.field select{padding:12px;border:1px solid var(--line);border-radius:12px;font-family:inherit}.save{border:0;cursor:pointer}.item{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}.danger{border:0;background:#8e2c24;color:white;border-radius:9px;padding:7px 10px}.note{font-size:11px;color:var(--muted);line-height:1.8}</style></head><body><header class="topbar"><div class="brand-mini"><img src="logo.jpg"><div><b>إدارة المنيو</b><small>مركز اللحوم ببيلا</small></div></div><a class="icon-btn" href="index.html">⌂</a></header><main class="admin"><div class="box"><h2>إضافة منتج</h2><p class="note">هذه النسخة تحفظ التعديلات على الجهاز نفسه. الربط السحابي بين الإدارة والزبائن يحتاج Firebase Web App وربط صلاحيات الإدارة قبل النشر النهائي.</p><div class="field"><label>اسم المنتج</label><input id="n"></div><div class="field"><label>القسم</label><select id="c"><option value="offers">العروض</option><option value="chicken">جاج</option><option value="lamb">غنم</option><option value="beef">عجل</option></select></div><div class="field"><label>السعر</label><input id="p" placeholder="مثال: 75000 ل.س / كغ"></div><div class="field"><label>الوصف</label><input id="d"></div><button class="primary save" onclick="addProduct()">إضافة المنتج</button></div><div class="box"><h2>المنتجات الحالية</h2><div id="list"></div></div></main><script>let data=JSON.parse(localStorage.getItem('babilaProducts')||'null')||[];if(!data.length){data=[{id:1,c:'offers',n:'عرض اليوم',d:'عرض مميز يحدده المحل يومياً',p:'حسب العرض',e:'🔥',tag:'عرض مميز'}];localStorage.setItem('babilaProducts',JSON.stringify(data))}function addProduct(){let n=document.getElementById('n').value.trim();if(!n)return alert('اكتب اسم المنتج');data.push({id:Date.now(),n,c:document.getElementById('c').value,p:document.getElementById('p').value||'حسب الوزن',d:document.getElementById('d').value||'',e:'🥩',tag:'جديد'});localStorage.setItem('babilaProducts',JSON.stringify(data));['n','p','d'].forEach(x=>document.getElementById(x).value='');render()}function del(id){data=data.filter(x=>x.id!==id);localStorage.setItem('babilaProducts',JSON.stringify(data));render()}function render(){document.getElementById('list').innerHTML=data.map(x=>`<div class="item"><span><b>${x.n}</b><small> — ${x.p}</small></span><button class="danger" onclick="del(${x.id})">حذف</button></div>`).join('')}render()</script></body></html>
